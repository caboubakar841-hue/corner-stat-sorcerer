<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRONO70 V2</title><style>body{font-family:system-ui;background:#0f1115;color:#fff;margin:0;padding:15px}h1{text-align:center;color:#00ff88}.controls{display:flex;gap:10px;justify-content:center;margin:15px 0}input,button{padding:10px;border-radius:8px;border:none}button{background:#00ff88;font-weight:bold} .card{background:#1c1f2a;border-radius:12px;padding:15px;margin:12px 0;border-left:4px solid #00ff88}.league{color:#8b90a0;font-size:13px}.badge{background:#00ff88;color:#000;padding:2px 6px;border-radius:4px;font-size:11px}.teams{font-size:18px;font-weight:bold;margin:8px 0}.predictions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pred-box{background:#252a38;padding:8px;border-radius:8px;text-align:center}.pred-label{font-size:11px;color:#8b90a0}.pred-value{font-weight:bold}.analyse{margin-top:10px;font-size:13px;color:#c0c3ce;background:#252a38;padding:8px;border-radius:6px}</style></head><body><h1>PRONO70 V2 ⚽</h1><div class="controls"><input type="date" id="datePicker"><button onclick="loadMatches()">Charger</button></div><div id="status" style="text-align:center;color:#8b90a0"></div><div id="matches"></div><script>const PRIORITY={"Premier League":1,"English Premier League":1,"LaLiga":2,"LALIGA":2,"Serie A":3,"Bundesliga":4,"Ligue 1":5,"Champions League":6};function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))&0xffffffff;return Math.abs(h)}function makePred(h,a,l,d){const s=hash(h+a+l+d);const r1=(s%100)/100,r2=((s*7)%100)/100,r3=((s*13)%100)/100;let v="";let c=55;const hw=0.53+(r1-0.5)*0.3,dw=0.27+(r2-0.5)*0.15,aw=1-hw-dw;if(hw>aw&&hw>dw){v=`Victoire ${h}`;c=Math.round(hw*100)}else if(aw>hw&&aw>dw){v=`Victoire ${a}`;c=Math.round(aw*100)}else{v="Match Nul";c=Math.round(dw*100)+12}c=Math.min(78,Math.max(52,c));const b=r2>0.38?"Oui":"Non",o=r3>0.35,t=o?(r3>0.75?"3-4 buts":"2-3 buts"):"0-2 buts",ol=o?"Plus de 2.5":"Moins de 2.5";let sc="1-1";if(v.includes(h))sc=r1<0.5?"2-1":"1-0";else if(v.includes(a))sc="1-2";return{victoire:v,confiance:c,btts:b,buts:`${ol} - ${t}`,score:sc,analyse:`${l}: ${h} a domicile. ${o?'Match ouvert':'Ferme'}. Score probable ${sc}.`}}async function loadMatches(){const d=document.getElementById('datePicker').value;const st=document.getElementById('status');const ct=document.getElementById('matches');st.textContent="Chargement matchs du "+d+"...";ct.innerHTML="";try{const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${d.replace(/-/g,'')}`);const j=await r.json();let ev=j.events||[];if(!ev.length){ct.innerHTML=`<div class="card">Aucun match reel pour ${d}.</div>`;st.textContent="0 match";return}ev.sort((a,b)=>{const na=a.leagues?.[0]?.name||"",nb=b.leagues?.[0]?.name||"";const pa=PRIORITY[na]||99,pb=PRIORITY[nb]||99;if(pa!==pb)return pa-pb;return new Date(a.date)-new Date(b.date)});st.textContent=`${ev.length} matchs reels`;ev.forEach(e=>{const comp=e.competitions[0];const hm=comp.competitors.find(c=>c.homeAway==='home')||comp.competitors[0];const aw=comp.competitors.find(c=>c.homeAway==='away')||comp.competitors[1];const lg=e.leagues?.[0]?.name||"Autre";const tm=new Date(e.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});const pr=makePred(hm.team.displayName,aw.team.displayName,lg,d);const top=(PRIORITY[lg]||99)<=5;ct.innerHTML+=`<div class="card"><div class="league">${lg} ${top?'<span class="badge">TOP</span>':''} <span style="float:right">${tm}</span></div><div class="teams">${hm.team.displayName} vs ${aw.team.displayName}</div><div class="predictions"><div class="pred-box"><div class="pred-label">Victoire</div><div class="pred-value">${pr.victoire}</div><div style="font-size:11px;color:#00ff88">${pr.confiance}%</div></div><div class="pred-box"><div class="pred-label">BTTS</div><div class="pred-value">${pr.btts}</div></div><div class="pred-box"><div class="pred-label">Buts</div><div class="pred-value">${pr.buts}</div></div><div class="pred-box"><div class="pred-label">Score Exact</div><div class="pred-value" style="font-size:20px">${pr.score}</div></div></div><div class="analyse">${pr.analyse}</div></div>`})}catch(e){st.textContent="Erreur "+e}}document.getElementById('datePicker').value=new Date().toISOString().split('T')[0];loadMatches();</script></body></html>
