<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prono70 - IA V9</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#0a0a0a;color:white}</style>
</head>
<body class="p-4">
<div class="max-w-4xl mx-auto">
  <header class="text-center py-6">
    <h1 class="text-4xl font-black">PRONO<span class="text-green-500">70</span></h1>
    <p class="text-gray-400 mt-2">IA V9 • Double Chance + BTTS Intelligent + Score Exact</p>
    <p id="date" class="text-sm text-gray-500 mt-1"></p>
  </header>

  <div id="loading" class="text-center py-20">
    <div class="animate-spin w-10 h-10 border-4 border-green-500 border-t-transparent rounded-full mx-auto"></div>
    <p class="mt-4 text-gray-400">Chargement des prédictions IA...</p>
  </div>

  <div id="container" class="space-y-4 hidden"></div>

  <div id="no-data" class="hidden text-center py-20 bg-zinc-900 rounded-2xl">
    <p class="text-gray-400">Pas de matchs aujourd'hui ou robot pas encore lancé.</p>
    <p class="text-xs text-gray-600 mt-2">Va dans Actions > AI Prono V9 > Run workflow</p>
  </div>
</div>

<script>
document.getElementById('date').innerText = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

async function load() {
  try {
    const res = await fetch('data/ai_predictions.json?t=' + Date.now());
    if(!res.ok) throw new Error('no file');
    const data = await res.json();
    if(!data || data.length===0) throw new Error('empty');
    
    document.getElementById('loading').classList.add('hidden');
    const cont = document.getElementById('container');
    cont.classList.remove('hidden');
    
    cont.innerHTML = data.map(m => {
      // Coherence BTTS / Score
      let btts = m.btts || 'OUI';
      let score = m.score_exact || '1-1';
      // Si score contient 1-1, 2-1 etc on force OUI
      if(score.includes('-')) {
        const [a,b] = score.split('-').map(Number);
        if(a>0 && b>0) btts = 'OUI';
        else if(a===0 || b===0) btts = 'NON';
      }
      const bttsColor = btts==='OUI' ? 'bg-green-500/20 text-green-400 border-green-500/30' : 'bg-red-500/20 text-red-400 border-red-500/30';
      const dcColor = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
      
      return `
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 hover:border-zinc-700 transition">
        <div class="flex justify-between items-start mb-3">
          <span class="text-xs bg-zinc-800 px-3 py-1 rounded-full text-gray-400">${m.league}</span>
          <span class="text-xs text-gray-500">${m.date}</span>
        </div>
        <h2 class="text-xl font-bold mb-4 text-center">${m.home} <span class="text-gray-600">vs</span> ${m.away}</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4 text-xs">
          <div class="bg-black/50 p-3 rounded-xl">
            <p class="font-bold text-gray-400 mb-1">${m.home} - 5 derniers</p>
            <p class="text-gray-300 leading-relaxed">${m.home_hist || 'N/A'}</p>
          </div>
          <div class="bg-black/50 p-3 rounded-xl">
            <p class="font-bold text-gray-400 mb-1">${m.away} - 5 derniers</p>
            <p class="text-gray-300 leading-relaxed">${m.away_hist || 'N/A'}</p>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div class="border ${dcColor} rounded-xl p-3 text-center">
            <p class="text-[10px] uppercase tracking-widest opacity-70">Double Chance</p>
            <p class="text-lg font-black mt-1">${m.double_chance}</p>
            <p class="text-xs mt-1">${m.dc_conf}% confiance</p>
          </div>
          <div class="border ${bttsColor} rounded-xl p-3 text-center">
            <p class="text-[10px] uppercase tracking-widest opacity-70">BTTS</p>
            <p class="text-lg font-black mt-1">${btts}</p>
            <p class="text-xs mt-1">${m.btts_conf}% confiance</p>
          </div>
          <div class="border bg-zinc-800/50 border-zinc-700 rounded-xl p-3 text-center">
            <p class="text-[10px] uppercase tracking-widest opacity-70 text-gray-400">Score Exact</p>
            <p class="text-lg font-black mt-1">${score}</p>
            <p class="text-[10px] text-gray-500 mt-1">IA PREDICTION</p>
          </div>
        </div>
        ${m.analyse ? `<p class="text-xs text-gray-500 mt-4 bg-black/30 p-3 rounded-xl italic">"${m.analyse}"</p>` : ''}
      </div>`;
    }).join('');
    
  } catch(e) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('no-data').classList.remove('hidden');
    console.error(e);
  }
}
load();
</script>
</body>
</html>
