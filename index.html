<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRONO70 V8.2 STABLE</title>
<style>
body{font-family:system-ui;background:#0f1115;color:#fff;margin:0;padding:12px}
h1{text-align:center;color:#00ff88;margin:6px 0} .sub{text-align:center;color:#8b90a0;font-size:11px;margin-bottom:10px}
.tabs{display:flex;gap:6px;justify-content:center;margin:10px 0}
.tab{padding:8px 12px;border-radius:20px;background:#252a38;color:#8b90a0;font-size:11px;cursor:pointer;border:1px solid #333}
.tab.active{background:#00ff88;color:#000;font-weight:bold}
.tab.live-active{background:#ff3b30;color:#fff;animation:blinkTab 1s infinite}
.card{background:#1c1f2a;border-radius:14px;padding:12px;margin:12px 0;border-left:4px solid #ffd600}
.card.live{border-left-color:#ff3b30;box-shadow:0 0 12px rgba(255,59,48,.4)}.card.fini{border-left-color:#8b90a0;opacity:.85}
.league{font-size:11px;color:#8b90a0;display:flex;justify-content:space-between}
.badge{padding:3px 7px;border-radius:4px;font-size:9px;font-weight:bold}
.badge.live{background:#ff3b30;color:#fff;animation:blink 1s infinite}.badge.fini{background:#444;color:#fff}.badge.top{background:#ffd600;color:#000}.badge.ia{background:#00ff88;color:#000}
@keyframes blink{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}@keyframes blinkTab{0%{box-shadow:0 0 0 0 rgba(255,59,48,.7)}70%{box-shadow:0 0 0 8px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
.teams{font-weight:bold;font-size:16px;margin:8px 0}.score-live{color:#ff3b30;font-size:20px}
.preds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.box{background:#252a38;padding:8px;border-radius:10px;text-align:center;border:1px solid #333}
.box.dc{border-color:#00ff88;background:#163a24}.box.btts{border-color:#ff8c00;background:#3a2a10}.box.score{border-color:#7c4dff;background:#1e1a33}.box.vic{border-color:#ffd600;background:#3a3310}
.label{font-size:8px;color:#8b90a0}.val{font-weight:bold;font-size:11px}.conf{font-size:9px;color:#00ff88}
.detail{background:#11131a;border:1px solid #2a2e3d;padding:10px;border-radius:10px;margin-top:8px;font-size:11px;line-height:1.5}
.hist{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.hist-col{background:#0f1115;padding:8px;border-radius:8px;border:1px solid #2a2e3d}.hist-title{font-size:10px;color:#ffd600;font-weight:bold;margin-bottom:4px}.hist-item{font-size:10px;padding:3px 0;display:flex;justify-content:space-between;border-bottom:1px solid #1a1d27}.W{color:#00ff88}.D{color:#ffd600}.L{color:#ff3b30}
</style>
</head>
<body>
<h1>PRONO70 V8.2 STABLE</h1>
<div class="sub" id="dateInfo">Chargement...</div>
<div class="tabs">
<div class="tab active" id="t-all" onclick="showTab('all')">🔥 DU JOUR</div>
<div class="tab" id="t-live" onclick="showTab('live')">🔴 LIVE <span id="liveCount"></span></div>
<div class="tab" id="t-hist" onclick="showTab('hist')">📜 HISTORIQUE</div>
</div>
<div id="all">Chargement du jour...</div><div id="live" style="display:none"></div><div id="hist" style="display:none"></div>

<script>
function showTab(t){
  document.getElementById('all').style.display=t==='all'?'block':'none';
  document.getElementById('live').style.display=t==='live'?'block':'none';
  document.getElementById('hist').style.display=t==='hist'?'block':'none';
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('t-'+t).classList.add('active');
}
const RATINGS={"Man City":92,"Manchester City":92,"Arsenal":90,"Liverpool":89,"Chelsea":84,"Tottenham":82,"Newcastle":80,"Aston Villa":80,"Ipswich Town":62,"Ipswich":62,"Nottingham Forest":76,"Al Hilal":88,"Al Nassr":87,"Barcelona":92,"Real Madrid":94};
function getRating(n){return RATINGS[n]||65;}
function getCoeff(l){l=l.toLowerCase(); if(l.includes("premier")) return 1.35; if(l.includes("la liga")) return 1.3; if(l.includes("bundesliga")) return 1.3; if(l.includes("serie a")) return 1.28; if(l.includes("ligue 1")) return 1.15; if(l.includes("saudi")) return 0.85; return 0.9;}

async function load(){
  const today=new Date();
  document.getElementById('dateInfo').innerText=today.toLocaleDateString('fr-FR')+" - V8.2 Stable";
  const dsToday=today.toISOString().split('T')[0].replace(/-/g,'');
  const yest=new Date(today); yest.setDate(yest.getDate()-1);
  const dsYest=yest.toISOString().split('T')[0].replace(/-/g,'');

  try{
    let events=[];
    for(let ds of [dsToday, dsYest]){
      try{
        let r=await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates="+ds);
        let j=await r.json();
        if(j.events) events=events.concat(j.events);
      }catch(e){}
    }

    if(events.length===0){
      document.getElementById('all').innerHTML="<div class='card'>Pas de matchs aujourd'hui. Vérifie demain.<br><button onclick='location.reload()' style='background:#00ff88;padding:10px;border:none;border-radius:8px;width:100%;margin-top:8px'>Recharger</button></div>";
      return;
    }

    let htmlAll="", htmlLive="", htmlHist="", liveCount=0;

    events.forEach(ev=>{
      let comp=ev.competitions?.[0]; if(!comp) return;
      let hm=comp.competitors.find(c=>c.homeAway==='home'), aw=comp.competitors.find(c=>c.homeAway==='away'); if(!hm||!aw) return;
      let lg=ev.leagues?.[0]?.name||"Match";
      let state=comp.status?.type?.state;
      let isLive=state==="in", isFini=state==="post";
      let hT=hm.team.displayName, aT=aw.team.displayName;
      let hR=getRating(hT), aR=getRating(aT), coeff=getCoeff(lg);
      
      // Calcul simple mais avec force adversaire + coeff
      let hScore=(hR*0.6)+(coeff*20)+5, aScore=(aR*0.6)+(coeff*20);
      let tot=hScore+aScore+15;
      let hPct=Math.round(hScore/tot*100), aPct=Math.round(aScore/tot*100), dPct=100-hPct-aPct;
      let dc=hPct>=aPct?"1X":"X2", conf=Math.max(hPct,aPct)+dPct;
      let btts=(hR>65 && aR>65)?"OUI":"NON", bttsConf= hR>65 && aR>65 ? 68 : 55;
      let scoreExact = hPct>aPct+15 ? "2-1" : aPct>hPct+10 ? "1-2" : "1-1";
      let victoire = hPct>=65 ? "Victoire "+hT : aPct>=65 ? "Victoire "+aT : null;
      let tm=new Date(ev.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      let sc=isLive||isFini? (hm.score+" - "+aw.score) : "";

      let vicBox = victoire ? `<div class="box vic"><div class="label">Victoire</div><div class="val">${victoire}</div><div class="conf">${Math.max(hPct,aPct)}%</div></div>` : `<div class="box dc"><div class="label">Double Chance</div><div class="val">${dc}</div><div class="conf">${conf}%</div></div>`;

      let card = `<div class="card ${isLive?'live':''} ${isFini?'fini':''}">
        <div class="league"><span><span class="badge top">${lg}</span> ${isLive?`<span class="badge live">● LIVE ${sc}</span>`:isFini?`<span class="badge fini">FINI ${sc}</span>`:`<span class="badge ia">V8.2</span>`}</span><span>${tm}</span></div>
        <div class="teams">${hT} vs ${aT} ${isLive?`<span class="score-live"> ${sc}</span>`:''}</div>
        <div class="preds">${vicBox}<div class="box btts"><div class="label">Les 2 marquent</div><div class="val">${btts}</div><div class="conf">${bttsConf}%</div></div><div class="box score"><div class="label">Score Exact</div><div class="val">${scoreExact}</div><div class="conf">H${hPct}% A${aPct}%</div></div></div>
        <div class="detail"><b>Analyse:</b> Force ${hT} ${hR} vs ${aT} ${aR} (40%). Coeff ligue ${lg} x${coeff} (20%). Domicile +5%. Forme pondérée par adversaires du même championnat à venir en V9 REAL (nécessite robot).<br><br>
        <b>BTTS ${btts}:</b> Basé sur force offensive.<br><b>Score ${scoreExact}:</b> Basé sur xG ${hR/50} - ${aR/50}.<br>${victoire?`<b>${victoire} proposée car proba >65%.</b>`:''}</div>
        <div class="hist"><div class="hist-col"><div class="hist-title">${hT} - 5 derniers (V9 REAL à venir)</div><div class="hist-item"><span style="color:#8b90a0">Vrai historique nécessite robot GitHub</span></div></div><div class="hist-col"><div class="hist-title">${aT} - 5 derniers (V9 REAL à venir)</div><div class="hist-item"><span style="color:#8b90a0">Vrai historique nécessite robot GitHub</span></div></div></div>
      </div>`;

      if(isFini) htmlHist+=card;
      else if(isLive){ htmlLive+=card; liveCount++; }
      else htmlAll+=card;
    });

    document.getElementById('all').innerHTML=htmlAll||"<div class='card'>Pas de matchs du jour</div>";
    document.getElementById('live').innerHTML=htmlLive||"<div class='card'>Pas de LIVE maintenant - le badge rouge clignotera ici avec le score live</div>";
    document.getElementById('hist').innerHTML=htmlHist||"<div class='card'>Pas de matchs finis hier</div>";
    document.getElementById('liveCount').innerText=liveCount>0?"("+liveCount+")":"";
    if(liveCount>0) document.getElementById('t-live').classList.add('live-active');

  }catch(err){
    document.getElementById('all').innerHTML="<div class='card'>Erreur: "+err+"<br><button onclick='location.reload()' style='background:#00ff88;padding:10px;border:none;border-radius:8px;width:100%;margin-top:8px'>Recharger</button></div>";
  }
}
load();
</script>
</body>
</html>
