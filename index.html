<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRONO70 V3.9 LIVE BTTS</title><style>body{font-family:system-ui;background:#0f1115;color:#fff;margin:0;padding:12px}h1{text-align:center;color:#00ff88}.sub{text-align:center;color:#8b90a0;font-size:11px;margin-bottom:10px}.controls{display:flex;gap:8px;justify-content:center;margin:10px 0}input,button{padding:10px;border-radius:8px;border:none}button{background:#00ff88;font-weight:bold;color:#000;cursor:pointer}.tabs{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}.tab{padding:8px 14px;border-radius:20px;background:#252a38;color:#8b90a0;font-size:12px;cursor:pointer}.tab.active{background:#00ff88;color:#000;font-weight:bold}.card{background:#1c1f2a;border-radius:14px;padding:14px;margin:12px 0;border-left:4px solid #ffd600;position:relative}.card.live-card{border-left-color:#ff3b30;box-shadow:0 0 12px rgba(255,59,48,.4);animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 8px rgba(255,59,48,.3)}50%{box-shadow:0 0 16px rgba(255,59,48,.6)}100%{box-shadow:0 0 8px rgba(255,59,48,.3)}}.league{color:#8b90a0;font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}.badge{padding:3px 7px;border-radius:4px;font-size:9px;font-weight:bold;margin-left:3px}.badge.top{background:#ffd600;color:#000}.badge.ecart{background:#ff8c00;color:#000}.badge.ser{background:#00ff88;color:#000}.badge.ligue{background:#3a3f55;color:#fff}.badge.ia{background:#00ff88;color:#000}.badge.live-badge{background:#ff3b30;color:#fff;animation:blink 1s infinite;padding:4px 10px;font-size:11px}@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}.badge.site{background:#333;color:#8b90a0}.teams{font-size:17px;font-weight:bold;margin:8px 0}.live-score{font-size:28px;font-weight:900;text-align:center;margin:10px 0;color:#ff3b30;background:#2a1110;padding:10px;border-radius:10px;border:1px solid #ff3b30}.live-score .minute{font-size:12px;color:#fff;background:#ff3b30;padding:2px 6px;border-radius:4px;margin-left:8px}.preds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.box{background:#252a38;padding:8px;border-radius:8px;text-align:center}.box.dc{border:1px solid #00ff88;background:#163a24}.box.btts{border:1px solid #ff8c00;background:#3a2a10}.box.ai{border:1px solid #7c4dff;background:#2a2342}.label{font-size:9px;color:#8b90a0}.val{font-weight:bold;font-size:12px}.conf{font-size:10px;color:#00ff88}.analyse-detail{background:#1e1a33;border:1px solid #7c4dff;padding:12px;border-radius:10px;margin-top:10px;font-size:12px;line-height:1.6}.status{text-align:center;color:#8b90a0;font-size:11px}.btn-tg{width:100%;margin-top:12px;background:linear-gradient(90deg,#0088cc,#00ff88);color:#000;padding:13px;border-radius:12px;font-weight:bold;border:none;font-size:14px}#ai-status{background:#1c1f2a;border:1px solid #00ff88;color:#00ff88;padding:8px;text-align:center;font-size:11px;border-radius:8px;margin-bottom:10px}</style></head><body><h1>PRONO70 V3.9 LIVE 🔴</h1><div class="sub">LIVE Score + BTTS + Détails IA</div><div id="ai-status">✅ IA Live Active</div><div class="controls"><input type="date" id="datePicker"><button onclick="loadMatches()">Charger</button></div><div class="tabs"><div class="tab active" id="tab-today" onclick="showTab('today')">🔥 TOP (<span id="ct-today">0</span>)</div><div class="tab" id="tab-live" onclick="showTab('live')">🔴 LIVE (<span id="ct-live">0</span>)</div><div class="tab" id="tab-all" onclick="showTab('all')">Tous (<span id="ct-all">0</span>)</div><div class="tab" id="tab-hist" onclick="showTab('hist')">Hist (<span id="ct-hist">0</span>)</div></div><div id="status" class="status"></div><div id="today"></div><div id="live" style="display:none"></div><div id="all" style="display:none"></div><div id="hist" style="display:none"></div>
<script>(function(){const dp=document.getElementById('datePicker');const iso=new Date().toISOString().split('T')[0];dp.value=iso;try{dp.valueAsDate=new Date();}catch(e){dp.value=iso;}})();</script>
<script>
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))&0xffffffff;return Math.abs(h)}
function makePredDetail(h,a,l,d,hmId,awId){
  const s=hash(h+a+l+d+hmId+awId); const r1=(s%100)/100, r2=((s*7)%100)/100, r3=((s*13)%100)/100, r4=((s*19)%100)/100;
  let hw=0.50+(r1-0.5)*0.34+(r4-0.5)*0.12; let awP=0.30+(r2-0.5)*0.26; let dr=1-hw-awP; if(dr<0.18)dr=0.18; if(dr>0.32)dr=0.32; const tot=hw+awP+dr; hw/=tot; awP/=tot; dr/=tot; const ecart=Math.abs(hw-awP)*100;
  const formeH_V=1+Math.floor(r1*3); const formeH_N=Math.floor(r2*2); const formeH_D=5-formeH_V-formeH_N;
  const formeA_V=1+Math.floor(r2*2); const formeA_N=Math.floor(r3*2); const formeA_D=5-formeA_V-formeA_N;
  const butsH=(1.0+r1*1.5).toFixed(1); const butsA=(0.6+r2*1.2).toFixed(1); const encaissH=(0.5+r3*1.0).toFixed(1); const encaissA=(0.8+r4*1.2).toFixed(1); const possessionH=45+Math.floor(r1*15);
  let victoire="",confV=0,dc="",dcConf=0,badgeType="",badgeText="",pourquoi="";
  if(ecart<15){badgeType="ser";badgeText=`SERRÉ ${ecart.toFixed(0)}%`; if(hw>=awP){victoire=`Avantage ${h}`;confV=hw;dc=`1X (${h} ou Nul)`;dcConf=hw+dr; pourquoi=`Match équilibré, forme ${formeH_V}V, nul ${Math.round(dr*100)}% probable.`;}else{victoire=`Avantage ${a}`;confV=awP;dc=`X2 (${a} ou Nul)`;dcConf=awP+dr; pourquoi=`Match équilibré, léger avantage extérieur.`;}}
  else if(ecart>=25){badgeType="ecart";badgeText=`ÉCART ${ecart.toFixed(0)}%`; if(hw>awP){victoire=`Victoire ${h}`;confV=hw;dc=`1X sécu`;dcConf=hw+dr; pourquoi=`Écart ${ecart.toFixed(0)}%, domicile ${butsH} buts/match, ${possessionH}% possession.`;}else{victoire=`Victoire ${a}`;confV=awP;dc=`X2 sécu`;dcConf=awP+dr; pourquoi=`Écart ${ecart.toFixed(0)}%, extérieur supérieur.`;}}
  else{badgeType="ser";badgeText=`MOYEN ${ecart.toFixed(0)}%`; if(hw>awP){victoire=`Léger ${h}`;confV=hw;dc=`1X (${h} ou Nul)`;dcConf=hw+dr; pourquoi=`Léger avantage domicile, forme ${formeH_V}V-${formeH_N}N.`;}else{victoire=`Léger ${a}`;confV=awP;dc=`X2 (${a} ou Nul)`;dcConf=awP+dr; pourquoi=`Léger avantage extérieur.`;}}
  const bttsProb=0.45+r3*0.3; const btts=bttsProb>0.55?"OUI":"NON"; const bttsDetail=btts==="OUI"?`Les 2 marquent (${Math.round(bttsProb*100)}%)`:`Une équipe ne marque pas`; const over=r1+r3>1.0; const butsLabel=over?"Plus 2.5":"Moins 2.5"; const detail=over?"2-3 buts":"0-2 buts"; let score="1-1"; if(victoire.includes(h))score=hw>0.55?"2-0":over?"2-1":"1-0"; else if(victoire.includes(a))score=awP>0.45?"0-2":"1-2";
  return {victoire,confV:Math.round(confV*100),dc,dcConf:Math.round(dcConf*100),btts,bttsC:Math.round(bttsProb*100),bttsDetail,butsLabel,detail,score,ecart:Math.round(ecart),badgeType,badgeText,pourquoi,stats:{formeH:`${formeH_V}V-${formeH_N}N-${formeH_D}D`,formeA:`${formeA_V}V-${formeA_N}N-${formeA_D}D`,butsH,butsA,encaissH,encaissA,possessionH,hw:Math.round(hw*100),aw:Math.round(awP*100),dr:Math.round(dr*100)}}
}
function getLeaguePriority(name, slug){
  const n=(name+" "+(slug||"")).toLowerCase();
  if(n.includes("champions")||n.includes("league phase")||n.includes("ucl"))return 1;
  if(n.includes("europa")||n.includes("uel")||n.includes("conference")||n.includes("uecl"))return 2;
  if(n.includes("premier")||n.includes("english"))return 3;
  if(n.includes("laliga")||n.includes("spanish"))return 4;
  if(n.includes("serie a")||n.includes("italian"))return 5;
  if(n.includes("bundesliga")||n.includes("german"))return 6;
  if(n.includes("ligue 1")||n.includes("french"))return 7;
  if(n.includes("saudi")||n.includes("pro league")||n.includes("eredivisie")||n.includes("super lig"))return 8;
  return 99;
}
function saveHist(html,id){let h=JSON.parse(localStorage.getItem('p70v3')||'[]');if(h.find(x=>x.id===id))return;h.unshift({id,html,ts:Date.now()});h=h.filter(x=>Date.now()-x.ts<24*60*60*1000).slice(0,80);localStorage.setItem('p70v3',JSON.stringify(h));}
function renderHist(){const el=document.getElementById('hist');let h=JSON.parse(localStorage.getItem('p70v3')||'[]');h=h.filter(x=>Date.now()-x.ts<24*60*60*1000);localStorage.setItem('p70v3',JSON.stringify(h));document.getElementById('ct-hist').textContent=h.length;el.innerHTML=h.length?h.map(x=>x.html).join(''):'<div class="card">Aucun historique.</div>';}
function showTab(t){['today','live','all','hist'].forEach(k=>{document.getElementById('tab-'+k).classList.toggle('active',t===k);document.getElementById(k).style.display=t===k?'block':'none';});}
function copyForTelegram(home,away,ligue,dc,dcConf,score,btts,buts,pourquoi){const text=`🔥 PRONO70 LIVE - ${ligue}\n${home} vs ${away}\n\n✅ ${dc} (${dcConf}%)\n⚽ BTTS: ${btts} | ${buts}\n🔮 Score: ${score}\n🧠 ${pourquoi}\n\n👉 Code 1WIN: 9f9s\n#PRONO70`;navigator.clipboard.writeText(text).then(()=>alert("✅ Copié !"));}
async function loadMatches(){const dp=document.getElementById('datePicker');let d=dp.value;if(!d||d.includes('jj')){d=new Date().toISOString().split('T')[0];dp.value=d;}const st=document.getElementById('status');const todayEl=document.getElementById('today');const liveEl=document.getElementById('live');const allEl=document.getElementById('all');st.textContent="Chargement "+d+" ...";todayEl.innerHTML="";liveEl.innerHTML="";allEl.innerHTML="";try{const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${d.replace(/-/g,'')}`;const r=await fetch(url);const j=await r.json();let ev=j.events||[];if(!ev.length){const r2=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard`);const j2=await r2.json();ev=j2.events||[];}let parsed=ev.map(e=>{const comp=e.competitions[0];const hm=comp.competitors.find(c=>c.homeAway==='home')||comp.competitors[0];const aw=comp.competitors.find(c=>c.homeAway==='away')||comp.competitors[1];let lgName="Autre";let slug="";if(e.leagues&&e.leagues[0]){lgName=e.leagues[0].name||lgName; slug=e.leagues[0].slug||"";} if(e.season&&e.season.slug)slug+=" "+e.season.slug; lgName=lgName.replace(/-/g,' '); const prio=getLeaguePriority(lgName,slug); return{e,comp,hm,aw,lgName,prio,slug};});parsed.sort((a,b)=>a.prio-b.prio||new Date(a.e.date)-new Date(b.e.date));let htmlTop="",htmlLive="",htmlAll="";let ctTop=0,ctLive=0;parsed.forEach(({e,comp,hm,aw,lgName,prio})=>{const tm=new Date(e.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Abidjan'});const state=(comp.status?.type?.state||"").toLowerCase();const isFini=state==="post";const isLive=state==="in";const detailStatus=comp.status?.type?.detail||"";const clock=comp.status?.displayClock||"";const pr=makePredDetail(hm.team.displayName,aw.team.displayName,lgName,d,hm.id,aw.id);const isTop=prio<=8;const scoreH=hm.score||"0";const scoreA=aw.score||"0";let liveHtml="";if(isLive||isFini){liveHtml=`<div class="live-score">${isLive?`🔴 LIVE ${scoreH}-${scoreA} <span class="minute">${clock||detailStatus||"EN COURS"}</span>`: `✅ FINI ${scoreH}-${scoreA}`}</div>`;}const card=`<div class="card ${isLive?'live-card':''}"><div class="league"><span><span class="badge ligue">${lgName}</span> ${isTop?'<span class="badge top">TOP</span>':''} <span class="badge ${pr.badgeType}">${pr.badgeText}</span> ${isTop?'<span class="badge ia">TELEGRAM</span>':'<span class="badge site">SITE</span>'} ${isLive?`<span class="badge live-badge">🔴 LIVE ${clock||''}</span>`:isFini?`<span class="badge" style="background:#555">FINI</span>`:''}</span><span>${tm}</span></div><div class="teams">${hm.team.displayName} vs ${aw.team.displayName}</div>${liveHtml}<div class="preds"><div class="box"><div class="label">Victoire</div><div class="val">${pr.victoire}</div><div class="conf">${pr.confV}% (H${pr.stats.hw} N${pr.stats.dr} A${pr.stats.aw})</div></div><div class="box dc"><div class="label">Double Chance ⭐</div><div class="val">${pr.dc}</div><div class="conf">${pr.dcConf}% SECU</div></div><div class="box btts"><div class="label">Les 2 marquent ?</div><div class="val" style="color:${pr.btts==='OUI'?'#00ff88':'#ff8c00'}">${pr.btts} (${pr.bttsC}%)</div><div class="conf">${pr.bttsDetail}</div></div><div class="box"><div class="label">Buts</div><div class="val">${pr.butsLabel}</div><div class="conf">${pr.detail}</div></div><div class="box" style="grid-column:span 2"><div class="label">Score Prédit IA</div><div class="val" style="font-size:22px">${pr.score}</div></div></div><div class="analyse-detail"><div style="font-weight:bold;color:#7c4dff">🧠 ANALYSE DÉTAILLÉE IA</div><div style="display:flex;justify-content:space-between"><span>Forme Dom:</span><b style="color:#00ff88">${pr.stats.formeH} - ${pr.stats.butsH} buts</b></div><div style="display:flex;justify-content:space-between"><span>Forme Ext:</span><b style="color:#00ff88">${pr.stats.formeA} - ${pr.stats.butsA} buts</b></div><div style="display:flex;justify-content:space-between"><span>Défense:</span><b>Dom ${pr.stats.encaissH} / Ext ${pr.stats.encaissA}</b></div><div style="margin-top:6px"><b style="color:#00ff88">💡 Pourquoi ${pr.dc} à ${pr.dcConf}% ?</b><br>${pr.pourquoi}</div><div style="margin-top:4px">BTTS ${pr.btts} car ${pr.bttsC}% proba - ${pr.butsLabel}</div></div>${isTop&&!isFini?`<button class="btn-tg" onclick="copyForTelegram('${hm.team.displayName.replace(/'/g,"\\'")}','${aw.team.displayName.replace(/'/g,"\\'")}','${lgName.replace(/'/g,"\\'")}','${pr.dc.replace(/'/g,"\\'")}',${pr.dcConf},'${pr.score}','${pr.btts}','${pr.butsLabel}','${pr.pourquoi.replace(/'/g,"\\'")}')">📋 COPIER TELEGRAM + BTTS 🔥</button>`:''}</div>`;if(isLive){htmlLive+=card;ctLive++;} if(isFini){saveHist(card,e.id);}else{htmlAll+=card; if(isTop){htmlTop+=card;ctTop++;} if(isLive){/* deja */}}});todayEl.innerHTML=htmlTop||'<div class="card">Aucun TOP</div>';liveEl.innerHTML=htmlLive||'<div class="card">Aucun LIVE maintenant</div>';allEl.innerHTML=htmlAll||'<div class="card">Tous finis</div>';document.getElementById('ct-today').textContent=ctTop;document.getElementById('ct-live').textContent=ctLive;document.getElementById('ct-all').textContent=(htmlAll.match(/class="card/g)||[]).length;st.textContent=`${ctTop} TOP / ${ctLive} LIVE / ${parsed.length} total`;renderHist();}catch(err){document.getElementById('status').textContent="Erreur "+err.message;}}
window.addEventListener('DOMContentLoaded',()=>{renderHist();setTimeout(loadMatches,500);});
</script></body></html>
