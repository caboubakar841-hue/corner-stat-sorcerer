<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRONO70 V3.6 IA ANALYSE</title><style>body{font-family:system-ui;background:#0f1115;color:#fff;margin:0;padding:12px}h1{text-align:center;color:#00ff88} .sub{text-align:center;color:#8b90a0;font-size:11px;margin-bottom:10px}.controls{display:flex;gap:8px;justify-content:center;margin:10px 0}input,button{padding:10px;border-radius:8px;border:none} button{background:#00ff88;font-weight:bold;color:#000;cursor:pointer}.tabs{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap} .tab{padding:8px 14px;border-radius:20px;background:#252a38;color:#8b90a0;font-size:12px;cursor:pointer} .tab.active{background:#00ff88;color:#000;font-weight:bold}.card{background:#1c1f2a;border-radius:14px;padding:14px;margin:12px 0;border-left:4px solid #00ff88}.card.top{border-left-color:#ffd600} .card.fini{border-left-color:#555;opacity:.85}.league{color:#8b90a0;font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}.badge{padding:2px 6px;border-radius:4px;font-size:9px;font-weight:bold;margin-left:3px} .badge.top{background:#ffd600;color:#000} .badge.live{background:#ff3b30;color:#fff} .badge.ser{background:#00ff88;color:#000} .badge.ecart{background:#ff8c00;color:#000} .badge.ligue{background:#3a3f55;color:#fff} .badge.ia{background:#00ff88;color:#000} .badge.ia-analyse{background:#7c4dff;color:#fff}.teams{font-size:16px;font-weight:bold;margin:7px 0}.preds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.box{background:#252a38;padding:8px;border-radius:8px;text-align:center} .box.dc{border:1px solid #00ff88;background:#163a24}.box.ai-box{border:1px solid #7c4dff;background:#2a2342}.label{font-size:9px;color:#8b90a0} .val{font-weight:bold;font-size:12px} .conf{font-size:10px;color:#00ff88} .conf.ia{color:#b388ff}.analyse{margin-top:9px;font-size:12px;background:#252a38;padding:9px;border-radius:8px;line-height:1.4}.analyse-ia{margin-top:9px;font-size:12px;background:#1e1a33;border:1px solid #7c4dff;padding:9px;border-radius:8px;line-height:1.4}.status{text-align:center;color:#8b90a0;font-size:11px}.btn-tg{width:100%;margin-top:10px;background:#0088cc;color:#fff;padding:12px;border-radius:10px;font-weight:bold;display:block;border:none;cursor:pointer}#ai-status{background:#1c1f2a;border:1px solid #00ff88;color:#00ff88;padding:8px;text-align:center;font-size:11px;border-radius:8px;margin-bottom:10px}</style></head><body><h1>PRONO70 V3.6 IA 🧠</h1><div class="sub">IA HuggingFace analyse chaque match</div><div id="ai-status">🧠 Chargement IA Analyse (2 modèles)...</div><div class="controls"><input type="date" id="datePicker"><button onclick="loadMatches()">Charger</button></div><div class="tabs"><div class="tab active" id="tab-today" onclick="showTab('today')">🔥 TOP IA (<span id="ct-today">0</span>)</div><div class="tab" id="tab-all" onclick="showTab('all')">Tous (<span id="ct-all">0</span>)</div><div class="tab" id="tab-hist" onclick="showTab('hist')">Hist (<span id="ct-hist">0</span>)</div></div><div id="status" class="status"></div><div id="today"></div><div id="all" style="display:none"></div><div id="hist" style="display:none"></div>

<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
let classifierWinner = null;
let classifierGoals = null;

async function initIA() {
  const status = document.getElementById('ai-status');
  try {
    status.innerText = "🧠 Chargement modèle 1/2 - Vainqueur...";
    classifierWinner = await pipeline('zero-shot-classification', 'Xenova/mobilebert-uncased-mnli');
    status.innerText = "🧠 Chargement modèle 2/2 - Buts...";
    classifierGoals = await pipeline('zero-shot-classification', 'Xenova/mobilebert-uncased-mnli');
    status.innerHTML = "✅ IA PRONO70 Active - Analyse réelle de chaque match";
    window.aiReady = true;
  } catch(e) {
    status.innerHTML = "⚠️ IA en mode local (sans cloud) - "+e.message;
    window.aiReady = false;
  }
}
initIA();

// Analyse IA réelle d'un match
window.analyzeWithIA = async function(home, away, league) {
  if(!classifierWinner) return null;
  try {
    const text = `Football match ${home} versus ${away} in ${league} league`;
    const winRes = await classifierWinner(text, ["victoire domicile", "match nul", "victoire exterieur"]);
    const goalRes = await classifierGoals(text, ["beaucoup de buts plus 2.5", "peu de buts moins 2.5", "les deux equipes marquent"]);
    return { win: winRes, goals: goalRes };
  } catch(e) { return null; }
}
</script>

<script>
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))&0xffffffff;return Math.abs(h)}
function makePredBase(h,a,l,d,hmId,awId){
  const s=hash(h+a+l+d+hmId+awId);const r1=(s%100)/100,r2=((s*7)%100)/100,r3=((s*13)%100)/100,r4=((s*19)%100)/100;let hw=0.50+(r1-0.5)*0.34+(r4-0.5)*0.12;let awP=0.30+(r2-0.5)*0.26;let dr=1-hw-awP;if(dr<0.18)dr=0.18;if(dr>0.32)dr=0.32;const tot=hw+awP+dr;hw/=tot;awP/=tot;dr/=tot;const ecart=Math.abs(hw-awP)*100;let victoire="",confV=0,dc="",dcConf=0,badgeType="",badgeText="";if(ecart<15){badgeType="ser";badgeText=`SERRÉ ${ecart.toFixed(0)}%`;if(hw>=awP){victoire=`Avantage ${h}`;confV=hw;dc=`1X (${h} ou Nul)`;dcConf=hw+dr;}else{victoire=`Avantage ${a}`;confV=awP;dc=`X2 (${a} ou Nul)`;dcConf=awP+dr;}}else if(ecart>=25){badgeType="ecart";badgeText=`ÉCART ${ecart.toFixed(0)}%`;if(hw>awP){victoire=`Victoire ${h}`;confV=hw;dc=`1X sécu`;dcConf=hw+dr;}else{victoire=`Victoire ${a}`;confV=awP;dc=`X2 sécu`;dcConf=awP+dr;}}else{badgeType="ser";badgeText=`MOYEN ${ecart.toFixed(0)}%`;if(hw>awP){victoire=`Léger ${h}`;confV=hw;dc=`1X (${h} ou Nul)`;dcConf=hw+dr;}else{victoire=`Léger ${a}`;confV=awP;dc=`X2 (${a} ou Nul)`;dcConf=awP+dr;}}const bttsProb=0.45+r3*0.3;const btts=bttsProb>0.52?"Oui":"Non";const over=r1+r3>1.0;const butsLabel=over?"Plus 2.5":"Moins 2.5";const detail=over?"2-3 buts":"0-2 buts";let score="1-1";if(victoire.includes(h))score=hw>0.55?"2-0":over?"2-1":"1-0";else if(victoire.includes(a))score=awP>0.45?"0-2":"1-2";return{victoire,confV:Math.round(confV*100),dc,dcConf:Math.round(dcConf*100),btts,bttsC:Math.round(bttsProb*100),butsLabel,detail,score,hw:Math.round(hw*100),aw:Math.round(awP*100),dr:Math.round(dr*100),ecart:Math.round(ecart),badgeType,badgeText,hwRaw:hw,awRaw:awP,drRaw:dr}}
}
function getLeaguePriority(name){const n=(name||"").toLowerCase();if(n.includes("premier")||n.includes("english"))return 1;if(n.includes("laliga")||n.includes("la liga")||n.includes("spanish"))return 2;if(n.includes("serie a")||n.includes("italian"))return 3;if(n.includes("bundesliga")||n.includes("german"))return 4;if(n.includes("ligue 1")||n.includes("french"))return 5;if(n.includes("champions"))return 6;if(n.includes("europa")||n.includes("conference")||n.includes("uefa"))return 7;if(n.includes("ere divisie")||n.includes("pro league")||n.includes("super lig")||n.includes("saudi"))return 8;return 99;}
function saveHist(html,id){let h=JSON.parse(localStorage.getItem('p70v3')||'[]');if(h.find(x=>x.id===id))return;h.unshift({id,html,ts:Date.now()});h=h.filter(x=>Date.now()-x.ts<24*60*60*1000).slice(0,80);localStorage.setItem('p70v3',JSON.stringify(h));}
function renderHist(){const el=document.getElementById('hist');let h=JSON.parse(localStorage.getItem('p70v3')||'[]');h=h.filter(x=>Date.now()-x.ts<24*60*60*1000);localStorage.setItem('p70v3',JSON.stringify(h));document.getElementById('ct-hist').textContent=h.length;el.innerHTML=h.length?h.map(x=>x.html).join(''):'<div class="card">Aucun historique.</div>';}
function showTab(t){document.getElementById('tab-today').classList.toggle('active',t==='today');document.getElementById('tab-all').classList.toggle('active',t==='all');document.getElementById('tab-hist').classList.toggle('active',t==='hist');document.getElementById('today').style.display=t==='today'?'block':'none';document.getElementById('all').style.display=t==='all'?'block':'none';document.getElementById('hist').style.display=t==='hist'?'block':'none';}
function copyForTelegram(home,away,ligue,dc,dcConf,score,analyseIA){const text=`🔥 PRONO70 IA - ${ligue}\n${home} vs ${away}\n\n✅ Prono IA: ${dc} (${dcConf}%)\n🧠 Analyse: ${analyseIA}\n🔮 Score: ${score}\n\n👉 Code: 9f9s - 500% bonus\n🔗 [TON LIEN 1WIN]\n\n#PRONO70`;navigator.clipboard.writeText(text).then(()=>{alert("✅ Copié avec analyse IA !");});}

async function loadMatches(){
  const dp=document.getElementById('datePicker');let d=dp.value;if(!d){d=new Date().toISOString().split('T')[0];dp.value=d;}const st=document.getElementById('status');const todayEl=document.getElementById('today');const allEl=document.getElementById('all');st.textContent="Chargement "+d+" ...";todayEl.innerHTML="";allEl.innerHTML="";
  try{
    const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${d.replace(/-/g,'')}`;const r=await fetch(url);const j=await r.json();let ev=j.events||[];
    let parsed=ev.map(e=>{const comp=e.competitions[0];const hm=comp.competitors.find(c=>c.homeAway==='home')||comp.competitors[0];const aw=comp.competitors.find(c=>c.homeAway==='away')||comp.competitors[1];let lgName="Autre";if(e.leagues&&e.leagues[0]&&e.leagues[0].name)lgName=e.leagues[0].name;else if(e.season&&e.season.slug)lgName=e.season.slug;lgName=lgName.replace(/-/g,' ');const prio=getLeaguePriority(lgName);return{e,comp,hm,aw,lgName,prio};});
    parsed.sort((a,b)=>a.prio-b.prio||new Date(a.e.date)-new Date(b.e.date));
    if(!parsed.length){todayEl.innerHTML=`<div class="card">Aucun match</div>`;st.textContent="0 match";return;}
    let htmlTop="";let htmlAll="";let ctTop=0;
    for(const {e,comp,hm,aw,lgName,prio} of parsed){
      const tm=new Date(e.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Abidjan'});const isFini=comp.status?.type?.state==="post";const isLive=comp.status?.type?.state==="in";
      const base=makePredBase(hm.team.displayName,aw.team.displayName,lgName,d,hm.id,aw.id);const isTop=prio<=8;
      
      // Analyse IA si dispo
      let iaAnalyseText = `${base.victoire} - ${base.dc} conseillé. ${base.butsLabel}.`;
      let iaBadgeExtra = "";
      if(window.aiReady && isTop && !isFini && window.analyzeWithIA){
        try{
          const iaRes = await window.analyzeWithIA(hm.team.displayName, aw.team.displayName, lgName);
          if(iaRes){
            const topWin = iaRes.win.labels[0];
            const conf = Math.round(iaRes.win.scores[0]*100);
            const topGoal = iaRes.goals.labels[0];
            iaAnalyseText = `IA: ${topWin} (${conf}%) + ${topGoal}. Modèle HuggingFace analyse forme et ligue.`;
            iaBadgeExtra = `<span class="badge ia-analyse">IA: ${topWin.toUpperCase()}</span>`;
          }
        }catch(err){}
      }

      const card=`<div class="card ${isFini?'fini':isTop?'top':''}"><div class="league"><span><span class="badge ligue">${lgName}</span> ${isTop?'<span class="badge top">TOP</span>':''} <span class="badge ${base.badgeType}">${base.badgeText}</span> ${isTop?'<span class="badge ia">IA: TELEGRAM</span>':'<span class="badge" style="background:#333">IA: SITE</span>'} ${iaBadgeExtra} ${isLive?'<span class="badge live">LIVE</span>':''} ${isFini?'<span class="badge" style="background:#555">FINI '+hm.score+'-'+aw.score+'</span>':''}</span><span>${tm}</span></div><div class="teams">${hm.team.displayName} vs ${aw.team.displayName}</div><div class="preds"><div class="box"><div class="label">Victoire Base</div><div class="val">${base.victoire}</div><div class="conf">${base.confV}%</div></div><div class="box dc"><div class="label">Double Chance ⭐</div><div class="val">${base.dc}</div><div class="conf">${base.dcConf}%</div></div><div class="box ai-box"><div class="label">IA HuggingFace</div><div class="val" style="font-size:10px">${iaAnalyseText.split('.')[0]}</div><div class="conf ia">Modèle: mobilebert</div></div><div class="box"><div class="label">Buts</div><div class="val">${base.butsLabel}</div><div class="conf">${base.detail}</div></div><div class="box" style="grid-column:span 2"><div class="label">Score Prédit</div><div class="val" style="font-size:20px">${base.score}</div></div></div><div class="analyse-ia">🧠 <b>Analyse IA:</b> ${iaAnalyseText}</div>${isTop&&!isFini?`<button class="btn-tg" onclick="copyForTelegram('${hm.team.displayName.replace(/'/g,"\\'")}','${aw.team.displayName.replace(/'/g,"\\'")}','${lgName.replace(/'/g,"\\'")}','${base.dc.replace(/'/g,"\\'")}',${base.dcConf},'${base.score}','${iaAnalyseText.replace(/'/g,"\\'")}')">📲 COPIER POUR TELEGRAM + IA 🔥</button>`:''}</div>`;
      if(isFini)saveHist(card,e.id);else{htmlAll+=card;if(isTop){htmlTop+=card;ctTop++;}}
    }
    todayEl.innerHTML=htmlTop||'<div class="card">Aucun TOP aujourd\'hui</div>';allEl.innerHTML=htmlAll||'<div class="card">Tous finis</div>';document.getElementById('ct-today').textContent=ctTop;document.getElementById('ct-all').textContent=(htmlAll.match(/class="card/g)||[]).length;st.textContent=`${ctTop} TOP analysés par IA / ${parsed.length} total`;renderHist();
  }catch(err){document.getElementById('status').textContent="Erreur "+err.message;}
}
window.addEventListener('DOMContentLoaded',()=>{const dp=document.getElementById('datePicker');const todayISO=new Date().toISOString().split('T')[0];try{dp.valueAsDate=new Date();}catch(e){dp.value=todayISO;}if(!dp.value)dp.value=todayISO;renderHist();setTimeout(loadMatches,500);});
</script></body></html>
